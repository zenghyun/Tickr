# Tickr GitHub Labels (단일 출처)
#
# 동기화:
#   gh label create  로 1회 생성
#   또는 https://github.com/marketplace/actions/github-labeler 액션으로 자동 동기화
#
# 본 파일을 단일 출처로 두고, 라벨 추가/변경 시 여기 먼저 반영 후 동기화.

# ─── 타입 (이슈 종류) ─────────────────────────────────
- name: task
  color: "0E8A16"      # green
  description: 일반 개발 작업 (로드맵 단위 포함)
- name: bug
  color: "D93F0B"      # red
  description: 의도와 다른 동작
- name: feature
  color: "1D76DB"      # blue
  description: 새 기능 제안
- name: chore
  color: "C5DEF5"      # light blue
  description: 의존성/툴링/스크립트 등 잡일
- name: docs
  color: "0075CA"      # blue
  description: 문서 변경
- name: refactor
  color: "FBCA04"      # yellow
  description: 동작 변경 없는 구조 개선

