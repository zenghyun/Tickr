name: 버그 (Bug)
description: 동작이 의도와 다른 경우
title: "[버그] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 무엇이 잘못됐나
      description: 한 줄 요약 + 발생 화면/엔드포인트
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 재현 절차
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected-vs-actual
    attributes:
      label: 기대 동작 vs 실제 동작
      value: |
        - 기대:
        - 실제:
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: 환경
      value: |
        - 플랫폼: iOS / Android / API
        - 버전:
        - 디바이스/시뮬레이터:

  - type: textarea
    id: logs
    attributes:
      label: 로그 / 스크린샷
