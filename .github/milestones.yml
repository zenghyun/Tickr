# Tickr GitHub Milestones (W1~W8)
#
# 동기화 명령 (gh CLI):
#   while IFS= read -r line; do
#     gh api repos/zenghyun/Tickr/milestones -f title="$line" >/dev/null
#   done < <(yq -r '.[].title' .github/milestones.yml)
#
# 또는 한 번에 1줄씩 수동:
#   gh api repos/zenghyun/Tickr/milestones -f title='W2 Claude Code 워크플로'

