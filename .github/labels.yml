# ─── 우선순위 ──────────────────────────────────────────
- name: priority/must
  color: "B60205"
  description: 이번 주차 안에 반드시
- name: priority/should
  color: "D93F0B"
  description: 이번 주차 또는 다음 초
- name: priority/could
  color: "FBCA04"
  description: 여유 있을 때

# ─── 상태 ──────────────────────────────────────────────
- name: status/blocked
  color: "E11D21"
  description: 선행 작업 / 외부 의존(KIS 승인 등)으로 진행 불가
- name: status/in-progress
  color: "FBCA04"
  description: 진행 중
- name: status/ready-for-review
  color: "0E8A16"
  description: PR 올라감 / 리뷰 대기

# ─── 메타 ──────────────────────────────────────────────
- name: legal
  color: "000000"
  description: 법적/컴플라이언스 (개인정보처리방침, 면책 등)
- name: needs-discussion
  color: "EE0701"
  description: 결정 전 논의 필요 (PLAN.md 갱신 후 task로 분해)
